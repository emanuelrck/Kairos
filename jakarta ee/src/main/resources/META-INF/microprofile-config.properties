# =====================================================================
# Kairos Maternal Engine — configuração principal
# =====================================================================

# ----- LLM (LangChain4j-CDI plugin chat-model) ------------------------
# Chaves em kebab-case — o CommonLLMPluginCreator faz dashToCamel internamente
# para encontrar o setter (api-key -> apiKey, model-name -> modelName, etc.).
dev.langchain4j.cdi.plugin.chat-model.class=dev.langchain4j.model.openai.OpenAiChatModel
dev.langchain4j.cdi.plugin.chat-model.config.api-key=${OPENAI_API_KEY}
dev.langchain4j.cdi.plugin.chat-model.config.model-name=gpt-4o-mini
dev.langchain4j.cdi.plugin.chat-model.config.temperature=0.3

# ----- Configuração da aplicação --------------------------------------
kairos.model.name=gpt-5
kairos.profile.default-locale=pt-PT
kairos.cli.default-mother-id=demo-ana
kairos.learning.min-confidence=0.6
kairos.memory.max-messages=20
